<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ミカゲ 監視対象管理</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f7fa; color: #18212f; }
      body { max-width: 1100px; margin: 32px auto; padding: 0 18px; }
      h1 { font-size: 1.7rem; margin-bottom: 6px; }
      .notice { color: #586579; margin: 0 0 24px; }
      main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; align-items: start; }
      section { background: white; border: 1px solid #dbe1ea; border-radius: 10px; padding: 18px; }
      label { display: block; font-size: .9rem; font-weight: 600; margin: 12px 0 5px; }
      input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #aeb9c8; border-radius: 6px; padding: 9px; font: inherit; }
      textarea { min-height: 120px; font-family: ui-monospace, monospace; }
      button { border: 0; border-radius: 6px; padding: 9px 13px; margin: 12px 6px 0 0; font: inherit; cursor: pointer; background: #135cc5; color: white; }
      button.secondary { background: #e7edf5; color: #18212f; }
      button.toggle { margin: 0; padding: 6px 9px; }
      .status { min-height: 1.4em; color: #174c28; }
      .error { color: #a41f27; }
      .target { border-top: 1px solid #e0e5ed; padding: 13px 0; }
      .target:first-child { border-top: 0; }
      .target h3 { margin: 0 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .target p { margin: 4px 0; overflow-wrap: anywhere; color: #586579; font-size: .9rem; }
      .disabled { opacity: .6; }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } body { margin-top: 18px; } }
    </style>
  </head>
  <body>
    <h1>監視対象管理</h1>
    <p class="notice">LAN内専用です。認証はありません。URLのhostはサーバーの許可リストで制限されます。無効化した対象の過去ログは残ります。</p>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <main>
      <section>
        <h2 id="form-title">対象を追加</h2>
        <form id="target-form">
          <label for="key">key</label>
          <input id="key" name="key" required maxlength="120" pattern="[A-Za-z0-9][A-Za-z0-9_-]*">
          <label for="name">表示名</label>
          <input id="name" name="name" required maxlength="200">
          <label for="url">URL</label>
          <input id="url" name="url" required maxlength="2048" type="url" placeholder="https://example.invalid/path">
          <label for="headers">HTTP headers (JSON object)</label>
          <textarea id="headers" name="headers" spellcheck="false" placeholder="{}"></textarea>
          <button id="save" type="submit">追加</button>
          <button id="cancel" class="secondary" type="button" hidden>編集をキャンセル</button>
        </form>
      </section>
      <section>
        <h2>登録済みの対象</h2>
        <div id="targets"></div>
      </section>
    </main>
    <script src="/admin.js" defer></script>
  </body>
</html>
