services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mikage}
    volumes:
      - mikage_postgres_data:/var/lib/postgresql/data
    networks:
      - mikage_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    cpus: 1.0
    mem_limit: 512m

  migrate:
    build:
      context: ../db
      dockerfile: Dockerfile
    working_dir: /db
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-mikage}
      MIKAGE_API_DB_PASSWORD: ${MIKAGE_API_DB_PASSWORD:?MIKAGE_API_DB_PASSWORD is required}
      MIKAGE_MAINTENANCE_DB_PASSWORD: ${MIKAGE_MAINTENANCE_DB_PASSWORD:?MIKAGE_MAINTENANCE_DB_PASSWORD is required}
    command: ["node", "migrate.mjs"]
    networks:
      - mikage_internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    cpus: 0.5
    mem_limit: 256m

  migration-import:
    image: postgres:17-alpine
    profiles: ["migration"]
    entrypoint: ["bash", "/migration/import-supabase.sh"]
    environment:
      MIKAGE_SOURCE_PGHOST: ${MIKAGE_SOURCE_PGHOST:-}
      MIKAGE_SOURCE_PGPORT: ${MIKAGE_SOURCE_PGPORT:-5432}
      MIKAGE_SOURCE_PGUSER: ${MIKAGE_SOURCE_PGUSER:-}
      MIKAGE_SOURCE_PGPASSWORD: ${MIKAGE_SOURCE_PGPASSWORD:-}
      MIKAGE_SOURCE_WRITES_FROZEN: ${MIKAGE_SOURCE_WRITES_FROZEN:-}
      MIKAGE_SOURCE_SNAPSHOT_ID: ${MIKAGE_SOURCE_SNAPSHOT_ID:-}
      MIKAGE_SOURCE_PGDATABASE: ${MIKAGE_SOURCE_PGDATABASE:-postgres}
      MIKAGE_SOURCE_PGSSLMODE: ${MIKAGE_SOURCE_PGSSLMODE:-verify-full}
      MIKAGE_SOURCE_PGSSLROOTCERT_BASE64: ${MIKAGE_SOURCE_PGSSLROOTCERT_BASE64:-}
      MIKAGE_TARGET_ALLOWED_HOSTS: ${MIKAGE_TARGET_ALLOWED_HOSTS:-}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mikage}
    volumes:
      - ../migration/import-supabase.sh:/migration/import-supabase.sh:ro
    networks:
      - mikage_internal
    depends_on:
      migration-preflight:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      PORT: "3100"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: mikage_api
      PGPASSWORD: ${MIKAGE_API_DB_PASSWORD:?MIKAGE_API_DB_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-mikage}
      MIKAGE_API_BEARER_TOKEN: ${MIKAGE_API_BEARER_TOKEN:?MIKAGE_API_BEARER_TOKEN is required}
      MIKAGE_ADMIN_ALLOWED_HOSTS: ${MIKAGE_ADMIN_ALLOWED_HOSTS:?MIKAGE_ADMIN_ALLOWED_HOSTS is required}
      MIKAGE_TARGET_ALLOWED_HOSTS: ${MIKAGE_TARGET_ALLOWED_HOSTS:-}
    networks:
      - mikage_internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    cpus: 0.5
    mem_limit: 256m

  watch-scheduler:
    profiles: ["watch"]
    build:
      context: ../scheduler
      dockerfile: Dockerfile
    environment:
      WATCH_SCHEDULER_ENABLED: ${WATCH_SCHEDULER_ENABLED:?WATCH_SCHEDULER_ENABLED must be explicitly set per service}
      MIKAGE_RENDER_WATCH_URL: ${MIKAGE_RENDER_WATCH_URL:-}
      MIKAGE_WATCH_EXECUTE_TOKEN: ${MIKAGE_WATCH_EXECUTE_TOKEN:-}
      HEALTH_PORT: "3200"
      HEALTH_STATE_FILE: /var/lib/mikage-watch/state.json
    volumes:
      - mikage_watch_scheduler_state:/var/lib/mikage-watch
    networks:
      - mikage_egress
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    cpus: 0.25
    mem_limit: 128m

  maintenance-scheduler:
    build:
      context: ../scheduler
      dockerfile: Dockerfile
    command: ["node", "src/maintenance-main.mjs"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: mikage_maintenance
      PGPASSWORD: ${MIKAGE_MAINTENANCE_DB_PASSWORD:?MIKAGE_MAINTENANCE_DB_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-mikage}
      HEALTH_PORT: "3200"
      HEALTH_STATE_FILE: /var/lib/mikage-maintenance/state.json
    volumes:
      - mikage_maintenance_scheduler_state:/var/lib/mikage-maintenance
    networks:
      - mikage_internal
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    cpus: 0.25
    mem_limit: 128m

  postgres-test-api:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MIKAGE_TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MIKAGE_TEST_POSTGRES_PASSWORD:-}
      POSTGRES_DB: mikage_test
    volumes:
      - mikage_postgres_test_api_data:/var/lib/postgresql/data
    networks:
      - mikage_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    cpus: 0.5
    mem_limit: 256m

  postgres-test-maintenance:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${MIKAGE_TEST_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MIKAGE_TEST_POSTGRES_PASSWORD:-}
      POSTGRES_DB: mikage_test
    volumes:
      - mikage_postgres_test_maintenance_data:/var/lib/postgresql/data
    networks:
      - mikage_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    cpus: 0.5
    mem_limit: 256m

  migrate-test-api:
    profiles: ["test"]
    build:
      context: ../db
      dockerfile: Dockerfile
    working_dir: /db
    environment:
      PGHOST: postgres-test-api
      PGPORT: "5432"
      PGUSER: ${MIKAGE_TEST_POSTGRES_USER:-postgres}
      PGPASSWORD: ${MIKAGE_TEST_POSTGRES_PASSWORD:-}
      PGDATABASE: mikage_test
      MIKAGE_API_DB_PASSWORD: ${MIKAGE_TEST_API_DB_PASSWORD:-}
      MIKAGE_MAINTENANCE_DB_PASSWORD: ${MIKAGE_TEST_MAINTENANCE_DB_PASSWORD:-}
    command: ["node", "migrate.mjs"]
    networks:
      - mikage_internal
    depends_on:
      postgres-test-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    cpus: 0.5
    mem_limit: 256m

  migrate-test-maintenance:
    profiles: ["test"]
    build:
      context: ../db
      dockerfile: Dockerfile
    working_dir: /db
    environment:
      PGHOST: postgres-test-maintenance
      PGPORT: "5432"
      PGUSER: ${MIKAGE_TEST_POSTGRES_USER:-postgres}
      PGPASSWORD: ${MIKAGE_TEST_POSTGRES_PASSWORD:-}
      PGDATABASE: mikage_test
      MIKAGE_API_DB_PASSWORD: ${MIKAGE_TEST_API_DB_PASSWORD:-}
      MIKAGE_MAINTENANCE_DB_PASSWORD: ${MIKAGE_TEST_MAINTENANCE_DB_PASSWORD:-}
    command: ["node", "migrate.mjs"]
    networks:
      - mikage_internal
    depends_on:
      postgres-test-maintenance:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    cpus: 0.5
    mem_limit: 256m

  integration-tests:
    profiles: ["test"]
    build:
      context: ../api
      dockerfile: Dockerfile
    command: ["npm", "test"]
    environment:
      MIKAGE_TEST_DATABASE_ISOLATED: "true"
      PGHOST: postgres-test-api
      PGPORT: "5432"
      PGUSER: mikage_api
      PGPASSWORD: ${MIKAGE_TEST_API_DB_PASSWORD:-}
      PGDATABASE: mikage_test
      MIKAGE_API_BEARER_TOKEN: ${MIKAGE_TEST_API_BEARER_TOKEN:-integration-test-bearer-token}
      MIKAGE_ADMIN_ALLOWED_HOSTS: ${MIKAGE_ADMIN_ALLOWED_HOSTS:-admin.example.test}
      MIKAGE_TARGET_ALLOWED_HOSTS: ${MIKAGE_TARGET_ALLOWED_HOSTS:-api.example.test}
      TEST_PGHOST: postgres-test-api
      TEST_PGPORT: "5432"
      TEST_PGUSER: ${MIKAGE_TEST_POSTGRES_USER:-postgres}
      TEST_PGPASSWORD: ${MIKAGE_TEST_POSTGRES_PASSWORD:-}
      TEST_PGDATABASE: mikage_test
    volumes:
      - ../api/tests:/app/tests:ro
    networks:
      - mikage_internal
    depends_on:
      migrate-test-api:
        condition: service_completed_successfully
      postgres-test-api:
        condition: service_healthy

  maintenance-integration-tests:
    profiles: ["test"]
    build:
      context: ../scheduler
      dockerfile: Dockerfile
    command: ["npm", "test"]
    environment:
      MIKAGE_TEST_DATABASE_ISOLATED: "true"
      PGHOST: postgres-test-maintenance
      PGPORT: "5432"
      PGUSER: mikage_maintenance
      PGPASSWORD: ${MIKAGE_TEST_MAINTENANCE_DB_PASSWORD:-}
      PGDATABASE: mikage_test
      TEST_PGHOST: postgres-test-maintenance
      TEST_PGPORT: "5432"
      TEST_PGUSER: ${MIKAGE_TEST_POSTGRES_USER:-postgres}
      TEST_PGPASSWORD: ${MIKAGE_TEST_POSTGRES_PASSWORD:-}
      TEST_MAINTENANCE_PGPASSWORD: ${MIKAGE_TEST_MAINTENANCE_DB_PASSWORD:-}
      TEST_PGDATABASE: mikage_test
    networks:
      - mikage_internal
    depends_on:
      migrate-test-maintenance:
        condition: service_completed_successfully
      postgres-test-maintenance:
        condition: service_healthy

  migration-preflight:
    profiles: ["migration"]
    build:
      context: ../scheduler
      dockerfile: Dockerfile
    command: ["node", "/app/migration/verify-migration.mjs", "--schema-only"]
    environment:
      MIKAGE_SOURCE_PGHOST: ${MIKAGE_SOURCE_PGHOST:-}
      MIKAGE_SOURCE_PGPORT: ${MIKAGE_SOURCE_PGPORT:-5432}
      MIKAGE_SOURCE_PGUSER: ${MIKAGE_SOURCE_PGUSER:-}
      MIKAGE_SOURCE_PGPASSWORD: ${MIKAGE_SOURCE_PGPASSWORD:-}
      MIKAGE_SOURCE_WRITES_FROZEN: ${MIKAGE_SOURCE_WRITES_FROZEN:-}
      MIKAGE_SOURCE_SNAPSHOT_ID: ${MIKAGE_SOURCE_SNAPSHOT_ID:-}
      MIKAGE_SOURCE_PGDATABASE: ${MIKAGE_SOURCE_PGDATABASE:-postgres}
      MIKAGE_SOURCE_PGSSLMODE: ${MIKAGE_SOURCE_PGSSLMODE:-verify-full}
      MIKAGE_SOURCE_PGSSLROOTCERT_BASE64: ${MIKAGE_SOURCE_PGSSLROOTCERT_BASE64:-}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-mikage}
    volumes:
      - ../migration/verify-migration.mjs:/app/migration/verify-migration.mjs:ro
    networks:
      - mikage_internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  migration-snapshot:
    image: postgres:17-alpine
    profiles: ["snapshot"]
    entrypoint: ["bash", "/migration/hold-source-snapshot.sh"]
    environment:
      MIKAGE_SOURCE_PGHOST: ${MIKAGE_SOURCE_PGHOST:-}
      MIKAGE_SOURCE_PGPORT: ${MIKAGE_SOURCE_PGPORT:-5432}
      MIKAGE_SOURCE_PGUSER: ${MIKAGE_SOURCE_PGUSER:-}
      MIKAGE_SOURCE_PGPASSWORD: ${MIKAGE_SOURCE_PGPASSWORD:-}
      MIKAGE_SOURCE_PGDATABASE: ${MIKAGE_SOURCE_PGDATABASE:-postgres}
      MIKAGE_SOURCE_PGSSLROOTCERT_BASE64: ${MIKAGE_SOURCE_PGSSLROOTCERT_BASE64:-}
    volumes:
      - ../migration/hold-source-snapshot.sh:/migration/hold-source-snapshot.sh:ro
    networks:
      - mikage_internal
    stdin_open: true
    tty: true

  migration-verify:
    profiles: ["migration"]
    build:
      context: ../scheduler
      dockerfile: Dockerfile
    command: ["node", "/app/migration/verify-migration.mjs"]
    environment:
      MIKAGE_SOURCE_PGHOST: ${MIKAGE_SOURCE_PGHOST:-}
      MIKAGE_SOURCE_PGPORT: ${MIKAGE_SOURCE_PGPORT:-5432}
      MIKAGE_SOURCE_PGUSER: ${MIKAGE_SOURCE_PGUSER:-}
      MIKAGE_SOURCE_PGPASSWORD: ${MIKAGE_SOURCE_PGPASSWORD:-}
      MIKAGE_SOURCE_WRITES_FROZEN: ${MIKAGE_SOURCE_WRITES_FROZEN:-}
      MIKAGE_SOURCE_SNAPSHOT_ID: ${MIKAGE_SOURCE_SNAPSHOT_ID:-}
      MIKAGE_SOURCE_PGDATABASE: ${MIKAGE_SOURCE_PGDATABASE:-postgres}
      MIKAGE_SOURCE_PGSSLMODE: ${MIKAGE_SOURCE_PGSSLMODE:-verify-full}
      MIKAGE_SOURCE_PGSSLROOTCERT_BASE64: ${MIKAGE_SOURCE_PGSSLROOTCERT_BASE64:-}
      MIKAGE_TARGET_ALLOWED_HOSTS: ${MIKAGE_TARGET_ALLOWED_HOSTS:-}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-mikage}
    volumes:
      - ../migration/verify-migration.mjs:/app/migration/verify-migration.mjs:ro
    networks:
      - mikage_internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

networks:
  mikage_internal:
    driver: bridge
  mikage_egress:
    driver: bridge

volumes:
  mikage_postgres_data:
  mikage_postgres_test_api_data:
  mikage_postgres_test_maintenance_data:
  mikage_watch_scheduler_state:
  mikage_maintenance_scheduler_state:
